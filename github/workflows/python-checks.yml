name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Syntax check
        run: python -m py_compile GitHub_Developer_Analytics.py

      - name: Lint with Ruff
        run: ruff check .

      - name: Validate example JSON
        run: python -m json.tool examples/identity_aliases.example.json

      # Importing the module does not start the GUI; Tkinter is optional at import time.
      - name: Import smoke test
        run: python -c "import GitHub_Developer_Analytics as g; print(g.APP_TITLE, g.APP_VERSION)"

# The GUI and the Git-based analysis are not exercised here: the runner has no display and
# no automated test suite exists yet (see tests/README.md).
